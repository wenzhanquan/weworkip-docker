<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企微远程登录</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=20261108"><link rel="alternate icon" type="image/vnd.microsoft.icon" href="/favicon.ico?v=20261108"><style>body{font:15px system-ui;margin:0;background:#182332;color:white}header{padding:12px 16px}a{color:#9ecbff}button{font:inherit;border:0;border-radius:6px;padding:10px 14px;margin:4px;background:#2572ce;color:white}#desktop{width:100%;height:calc(100dvh - 170px);min-height:420px;border:0;background:#222}p{margin:8px 0}#hint{color:#c7dbf5;font-size:13px}</style></head><body><header><a href="/">← 返回面板</a><button onclick="start()">开始 / 重新打开登录</button><button onclick="stop()">结束登录窗口</button><p id="status">正在连接远程浏览器…</p><p id="hint">可横屏操作滑块；二维码可用另一部设备扫描。相册识码能否使用取决于企业微信。</p></header><iframe id="desktop" title="NAS 上的企业微信登录浏览器" src="/remote/vnc.html?autoconnect=true&resize=scale&reconnect=true&path=remote/websockify"></iframe><script>
async function start(){try{const r=await fetch('/refresh_qr_api',{method:'POST',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('打开失败：'+r.status);const s=await r.json();document.querySelector('#status').textContent=s.msg}catch(e){document.querySelector('#status').textContent=e.message}}
async function stop(){await fetch('/cancel_login_api',{method:'POST'});document.querySelector('#status').textContent='正在结束登录窗口…'}
async function poll(){try{const r=await fetch('/status_api');const s=await r.json();document.querySelector('#status').textContent=s.login_message||s.status;if(s.login_status==='success'){document.querySelector('#hint').textContent='新的 Cookie 已保存，可返回主面板查看实际验证结果和运行日志。'}}catch(e){}}
start();setInterval(poll,2500);
</script></body></html>
