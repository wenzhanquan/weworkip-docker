services:
  weworkip:
    image: wenzhanquan/weworkip:latest
    build: .
    container_name: weworkip
    restart: unless-stopped
    shm_size: "256m"
    ports:
      - "9001:8080"
    environment:
      TZ: Asia/Shanghai
      WECHAT_URLS: "${WECHAT_URLS:-}"
      CHECK_CRON: "*/11 * * * *"
      OVERWRITE: "True"
      PUSHPLUS_TOKEN: "${PUSHPLUS_TOKEN:-}"
    volumes:
      - ./data:/app/data
