name: Publish independent Emby new actors image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v (for example 1.0.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wenzhanquan/emby-new-actors
          ref: 5cb1ba24eb03827acf0d7f044bd44e24e7164f02
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s . -q
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            wenzhanquan/emby-new-actors:${{ inputs.version }}
            wenzhanquan/emby-new-actors:latest
