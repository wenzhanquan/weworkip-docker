name: WeWorkIP Test and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weworkip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run regression tests with real Chromium
        run: |
          docker run --rm --network none --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/tests:ro" \
            -e PYTHONPATH=/app \
            -e WECHAT_URLS=https://fixture.invalid/app \
            weworkip:ci -c 'Xvfb :98 -screen 0 1100x820x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & sleep 1; DISPLAY=:98 python -m unittest discover -s /tests -p "test_*.py"'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wenzhanquan/weworkip
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish tested Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
